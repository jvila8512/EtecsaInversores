# PostgreSQL database for Inversor Monitor
name: inversormonitor
services:
  postgresql:
    image: postgres:17.4
    volumes:
      - pgdata:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=inversorMonitor
      - POSTGRES_PASSWORD=etecsa2026
      - POSTGRES_DB=inversorMonitor
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:5433:5432
volumes:
  pgdata:
