# Inversor Monitor — Application + PostgreSQL
name: inversormonitor
services:
  app:
    image: inversormonitor
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=prod,api-docs
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/inversorMonitor?stringtype=unspecified
      - SPRING_DATASOURCE_USERNAME=inversorMonitor
      - SPRING_DATASOURCE_PASSWORD=etecsa2026
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgresql:5432/inversorMonitor?stringtype=unspecified
      - SPRING_LIQUIBASE_USER=inversorMonitor
      - SPRING_LIQUIBASE_PASSWORD=etecsa2026
      - APP_UPLOAD_DIR=/app/profile-images
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
    ports:
      - 127.0.0.1:8081:8080
    volumes:
      - profile-images:/app/profile-images
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/management/health
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      postgresql:
        condition: service_healthy
  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql
volumes:
  profile-images:
  pgdata:
